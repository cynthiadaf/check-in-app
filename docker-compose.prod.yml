services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: https://www.${ROOT_DOMAIN}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:?AUTH_SETUP_TOKEN is required}
      AUTH_COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
