<!doctype html>
<html lang="en-GB" class="auth-pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change password - Guest Check-In Manager</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <script>
      window.APP_CONFIG = { API_BASE_URL: "" };
    </script>
    <header class="site-header">
      <a class="brand" href="/index.html">Guest Check-In Manager</a>
    </header>
    <main class="container narrow">
      <section class="hero">
        <p class="eyebrow">Account security</p>
        <h1>Change password</h1>
        <p class="muted">
          Changing your password signs out other active sessions.
        </p>
      </section>
      <form id="password-form" class="card form-card">
        <label for="current-password">Current password</label
        ><input
          id="current-password"
          name="current_password"
          type="password"
          autocomplete="current-password"
          required
        />
        <label for="new-password">New password</label
        ><input
          id="new-password"
          name="new_password"
          type="password"
          minlength="12"
          autocomplete="new-password"
          required
        />
        <label for="confirm-password">Confirm new password</label
        ><input
          id="confirm-password"
          type="password"
          minlength="12"
          autocomplete="new-password"
          required
        />
        <p id="page-message" class="message" role="alert"></p>
        <div class="form-actions">
          <a class="button button-secondary" href="/index.html">Cancel</a
          ><button class="button" type="submit">Update password</button>
        </div>
      </form>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/password.js"></script>
  </body>
</html>
