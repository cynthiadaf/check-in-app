<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest Register</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
  <script>window.APP_CONFIG = { API_BASE_URL: "http://localhost:8000" };</script>
  <header class="site-header"><a class="brand" href="/index.html">Guest Check-In Manager</a><nav aria-label="Main navigation"><a href="/index.html">Dashboard</a><a href="/pages/register.html" aria-current="page">Register</a><a class="button button-small" href="/pages/new-entry.html">Add guest</a></nav></header>
  <main class="container">
    <section class="hero"><p class="eyebrow">Guest register</p><h1>Recent check-ins</h1><p class="muted">Search and filter the register. Newest check-ins appear first.</p></section>
    <form id="register-filters" class="toolbar filter-form">
      <label for="filter-date">Date</label><input id="filter-date" type="date">
      <label for="filter-search">Guest name</label><input id="filter-search" type="search" placeholder="Search names">
      <button class="button button-secondary" type="submit">Apply filters</button>
    </form>
    <p id="page-message" class="message" role="status"></p>
    <div id="register-loading" class="loading" hidden>Loading register…</div>
    <div class="table-wrap card"><table><caption class="sr-only">Guest entries</caption><thead><tr><th>Guest name</th><th>Check-in</th><th>Notes</th><th>Payment</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="entries-body"></tbody></table><p id="empty-state" class="empty" hidden>No guest entries match these filters.</p></div>
    <div class="pagination"><button id="previous-page" class="button button-secondary">Previous</button><span id="page-indicator" aria-live="polite"></span><button id="next-page" class="button button-secondary">Next</button></div>
  </main>
  <script src="/js/app.js"></script><script src="/js/register.js"></script>
</body>
</html>
