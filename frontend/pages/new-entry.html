<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add guest</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
  <script>window.APP_CONFIG = { API_BASE_URL: "http://localhost:8000" };</script>
  <header class="site-header"><a class="brand" href="/index.html">Guest Check-In Manager</a><nav aria-label="Main navigation"><a href="/index.html">Dashboard</a><a href="/pages/register.html">Register</a></nav></header>
  <main class="container narrow"><section class="hero"><p class="eyebrow">New check-in</p><h1>Add a guest</h1><p class="muted">Check-in time and date are recorded automatically.</p></section>
    <form id="new-entry-form" class="card form-card"><label for="guest-name">Guest name</label><input id="guest-name" name="guest_name" maxlength="200" required autofocus><label for="notes">Notes</label><textarea id="notes" name="notes" maxlength="2000" rows="5" required></textarea><p id="page-message" class="message" role="alert"></p><div class="form-actions"><a class="button button-secondary" href="/pages/register.html">Cancel</a><button class="button" type="submit">Save check-in</button></div></form>
  </main><script src="/js/app.js"></script><script src="/js/new-entry.js"></script>
</body>
</html>
