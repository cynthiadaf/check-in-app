upstream checkin_frontend {
  server 127.0.0.1:3000;
}

upstream checkin_backend {
  server 127.0.0.1:8000;
}

upstream checkin_dev_frontend {
  server 127.0.0.1:3001;
}

upstream checkin_dev_backend {
  server 127.0.0.1:8001;
}

server {
  listen 80;
  server_name __ROOT_DOMAIN__ www.__ROOT_DOMAIN__ dev.__ROOT_DOMAIN__;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name __ROOT_DOMAIN__ www.__ROOT_DOMAIN__;

  ssl_certificate /etc/nginx/ssl/cloudflare-origin.crt;
  ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/ {
    proxy_pass http://checkin_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /health {
    proxy_pass http://checkin_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://checkin_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name dev.__ROOT_DOMAIN__;

  ssl_certificate /etc/nginx/ssl/cloudflare-origin.crt;
  ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/ {
    proxy_pass http://checkin_dev_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /health {
    proxy_pass http://checkin_dev_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://checkin_dev_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

